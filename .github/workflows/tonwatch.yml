name: tonwatch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          TONKEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,os,sys,base64
          ADDR="UQDhvgDhkI3jBzs8x4MO88JjTik8irqQpqzHuZlnCorz-xkI"
          KEY=os.environ.get("TONKEY")
          if not KEY:
              print("ERROR: secret TONCENTER_API_KEY not set"); sys.exit(1)

          def to_raw(addr):
              if not addr: return ""
              addr = addr.strip()
              if addr.startswith("0:") or addr.startswith("-1:"):
                  return addr.lower()
              try:
                  b = base64.urlsafe_b64decode(addr + "=" * (-len(addr) % 4))
                  if len(b) != 36: return addr.lower()
                  wc = b[1]
                  if wc > 127: wc -= 256
                  return f"{wc}:{b[2:34].hex().lower()}"
              except Exception:
                  return addr.lower()

          MY_RAW = to_raw(ADDR)
          print(f"Target wallet raw: {MY_RAW}")

          old=[]
          if os.path.exists("ton_tx.json"):
              try:
                  with open("ton_tx.json", "r", encoding="utf-8") as f:
                      old = json.load(f)
                  if not isinstance(old, list): old = []
              except Exception:
                  old = []
          seen = {t.get("hash") for t in old if isinstance(t, dict) and t.get("hash")}
          seen_in_run = set()
          new = []
          lt = None
          tx_hash = None
          total_api = 0

          for page in range(5):
              url = f"https://toncenter.com/api/v2/getTransactions?address={ADDR}&limit=100"
              if lt and tx_hash:
                  url += f"&lt={lt}&hash={tx_hash}"
              req = urllib.request.Request(url, headers={"X-API-Key": KEY})
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=30))
              except Exception as e:
                  print("fetch fail", e); sys.exit(1)
              if not j.get("ok"):
                  print("api not ok:", json.dumps(j)[:500]); sys.exit(1)
              
              res = j.get("result", [])
              total_api += len(res)
              print(f"Page {page+1}: {len(res)} transactions returned")
              if not res: break

              page_added = 0
              for t in res:
                  txid = t.get("transaction_id") or {}
                  h = txid.get("hash")
                  if not h or h in seen or h in seen_in_run:
                      continue
                  
                  inn = t.get("in_msg") or {}
                  val = inn.get("value")
                  if val is None: continue
                  try:
                      v_int = int(val)
                      if v_int <= 0: continue
                  except (ValueError, TypeError):
                      continue

                  dest_raw = to_raw(inn.get("destination"))
                  if dest_raw != MY_RAW:
                      continue

                  src = inn.get("source") or ""
                  decode_err = inn.get("message_decode_error")
                  msg = inn.get("message")
                  if decode_err: msg = ""
                  memo = (msg or "").strip()
                  
                  rec = {
                      "hash": h,
                      "from": src,
                      "dest": dest_raw,
                      "value": v_int,
                      "comment": memo,
                      "utime": int(t.get("utime") or 0)
                  }
                  new.append(rec)
                  seen_in_run.add(h)
                  page_added += 1
                  print(f"  [NEW] hash={h[:20]}... val={v_int} memo='{memo}'")

              print(f"Page {page+1} added: {page_added}")
              last_txid = res[-1].get("transaction_id") or {}
              lt = last_txid.get("lt")
              tx_hash = last_txid.get("hash")
              if len(res) < 100: break

          alltx = (old + new)[-1000:]
          with open("ton_tx.json", "w", encoding="utf-8") as f:
              json.dump(alltx, f, ensure_ascii=False, indent=2)
          print(f"Total API txs seen: {total_api}, Valid NEW incoming: {len(new)}")
          PY
      - name: commit
        run: |
          git config user.name "tonwatch"
          git config user.email "tonwatch@users.noreply.github.com"
          git add ton_tx.json
          git diff --cached --quiet || { git commit -m "ton tx"; git push; }
