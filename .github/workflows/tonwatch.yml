name: tonwatch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          TONKEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request
          from urllib.parse import urlencode
          ADDR = "UQDhvgDhkI3jBzs8x4MO88JjTik8irqQpqzHuZlnCorz-xkI"
          KEY = os.environ.get("TONKEY")
          if not KEY:
              print("ERROR: secret TONCENTER_API_KEY not set")
              sys.exit(1)
          def to_raw(addr):
              if not addr: return ""
              addr = addr.strip()
              if addr.startswith(("0:", "-1:")): return addr.lower()
              try:
                  b = base64.urlsafe_b64decode(addr + "=" * (-len(addr) % 4))
                  if len(b) != 36: return addr.lower()
                  wc = b[1] - 256 if b[1] > 127 else b[1]
                  return f"{wc}:{b[2:34].hex().lower()}"
              except Exception: return addr.lower()
          target = to_raw(ADDR)
          old = []
          try:
              with open("ton_tx.json", encoding="utf-8") as f: old = json.load(f)
              if not isinstance(old, list): old = []
          except Exception: pass
          seen = {x.get("hash") for x in old if isinstance(x, dict) and x.get("hash")}
          new, seen_run, lt, tx_hash = [], set(), None, None
          for page in range(5):
              params = {"address": ADDR, "limit": 100}
              if lt and tx_hash:
                  params.update(lt=str(lt), hash=str(tx_hash))
              url = "https://toncenter.com/api/v2/getTransactions?" + urlencode(params)
              req = urllib.request.Request(url, headers={"X-API-Key": KEY})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: data = json.load(r)
              except Exception as e:
                  print("fetch fail", e); sys.exit(1)
              if not data.get("ok"):
                  print("api not ok:", json.dumps(data)[:500]); sys.exit(1)
              result = data.get("result") or []
              print(f"Page {page + 1}: {len(result)} transactions returned")
              if not result: break
              added = 0
              for item in result:
                  h = (item.get("transaction_id") or {}).get("hash")
                  if not h or h in seen or h in seen_run: continue
                  msg = item.get("in_msg") or {}; value = msg.get("value")
                  try: value = int(value)
                  except (TypeError, ValueError): continue
                  if value <= 0 or to_raw(msg.get("destination")) != target: continue
                  comment = "" if msg.get("message_decode_error") else (msg.get("message") or "").strip()
                  new.append({"hash": h, "from": msg.get("source") or "", "dest": target,
                              "value": value, "comment": comment, "utime": int(item.get("utime") or 0)})
                  seen_run.add(h); added += 1
                  print(f" [NEW] hash={h[:20]}... val={value} memo='{comment}'")
              print(f"Page {page + 1} added: {added}")
              last = result[-1].get("transaction_id") or {}
              lt, tx_hash = last.get("lt"), last.get("hash")
              if len(result) < 100: break
          with open("ton_tx.json", "w", encoding="utf-8") as f:
              json.dump((old + new)[-1000:], f, ensure_ascii=False, indent=2)
          print(f"Valid NEW incoming: {len(new)}")
          PY
      - name: commit
        run: |
          git config user.name "tonwatch"
          git config user.email "tonwatch@users.noreply.github.com"
          git add ton_tx.json
          git diff --cached --quiet || { git commit -m "ton tx"; git push; }
